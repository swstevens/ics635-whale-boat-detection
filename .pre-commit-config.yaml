# Install once per clone with:  uv run pre-commit install
# Hooks use the project's own pinned tools via uv, so everyone runs the same versions.
repos:
  - repo: local
    hooks:
      - id: nbstripout
        name: strip notebook outputs
        entry: uv run nbstripout
        language: system
        files: \.ipynb$
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, jupyter]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, jupyter]
