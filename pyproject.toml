[project]
name = "ics635-whale-boat-detection"
version = "0.1.0"
description = "Whale and boat detection in Planet SkySat imagery"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch>=2.1",
    "timm>=1.0",
    "einops",
    "numpy",
    "matplotlib",
    "scikit-learn",
    "rasterio",
    "google-api-python-client",
    "jupyter",
    "ipykernel",
    "transformers>=5.20.2",
    "optuna>=5.0.0",
]

[dependency-groups]
dev = ["ruff", "pre-commit", "nbstripout"]
# scripts/ that build and check the SkySat chips from the source scenes and shapefiles.
data = ["pyshp", "pandas"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Colleague's SatViT code, kept as-is for reference while we adapt it.
extend-exclude = ["satvit"]

[tool.ruff.format]
# Single quotes, matching the 605 notebook this project builds on.
quote-style = "single"

[tool.ruff.lint]
# pycodestyle (PEP 8) errors and warnings, pyflakes (unused imports, undefined
# names), and import sorting.
select = ["E", "W", "F", "I"]
